name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag planpilot-service:ci .
      - run: >-
          docker run --rm --user 0:0 planpilot-service:ci
          sh -c "pip install --no-cache-dir -r requirements-dev.txt &&
          python -m pytest -q tests lib/planpilot/translate/tests"
      - name: Run service smoke test
        run: |
          docker run -d --name planpilot-ci -p 5000:5000 \
            -e API_KEY=test-planpilot-key planpilot-service:ci
          if ! API_KEY=test-planpilot-key python3 scripts/smoke_sessions.py; then
            docker logs planpilot-ci
            docker rm --force planpilot-ci
            exit 1
          fi
          docker rm --force planpilot-ci
